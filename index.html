<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Honda Jet ISIS</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=B612+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');

    :root { color-scheme: dark; }

    body {
        font-family: 'B612 Mono', monospace;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding-top: 1.5rem;
        padding-bottom: 1.5rem;
        background-color: #000;
        color: #fff;
    }

    input[type=range] { accent-color:#FDE500; }
    .ctrl-label { font-variant-numeric: tabular-nums; }

    svg text,
    #pitchLadder span,
    #headingTrack span,
    #machQnh {
        font-family: 'B612 Mono', monospace !important;
    }

    /* Layout & Structure */
    .instrument-container {
        height: 512px;
        width: 512px;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
    }

    .instrument-display {
        height: 476px;
        width: 488px;
        margin-top: 0.75rem;
        border-radius: 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* Speed Tape */
    .tape-container {
        height: 100%;
        background-color: #333333;
        display: flex;
        align-items: center;
        position: relative;
    }
    #speedTape {
        width: 66px;
        border-top-left-radius: 0.375rem;
        border-bottom-left-radius: 0.375rem;
    }
    .scale-track {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        pointer-events: none;
        overflow: hidden;
    }
    #airspeedScaleTrack {
        border-top-left-radius: 0.375rem;
        border-bottom-left-radius: 0.375rem;
    }
    .speed-svg-container {
        position: absolute;
        transform: translateY(-16px);
        z-index: 20;
    }

    /* Center Panel */
    .center-panel {
        height: 100%;
        width: 355px;
        margin-left: 3px;
        margin-right: 3px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    #machQnh {
        height: 33px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.5rem;
        line-height: 2rem;
        color: white;
    }

    /* Horizon */
    #artificialHorizon {
        height: 384px;
        width: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .pitch-ladder-container {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 10;
        pointer-events: none;
    }
    #pitchLadder {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #groundEarth {
        position: absolute;
        display: flex;
        flex-direction: column;
        pointer-events: none;
        height: 3000px;
        width: 3000px;
        top: 50%;
        left: 50%;
        margin-top: -1500px;
        margin-left: -1500px;
    }
    .sky-bg {
        background-color: #065CCC;
        width: 100%;
        height: 1500px;
    }
    .horizon-line {
        background-color: white;
        height: 4px;
        width: 100%;
        flex-shrink: 0;
    }
    .ground-bg {
        background-color: #612D20;
        width: 100%;
        height: 1500px;
    }

    /* Indicators */
    #staticRollIndicator {
        position: absolute;
        transform: translateY(-128px);
        z-index: 20;
    }
    #rollPointerContainer {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 30;
        display: flex;
        justify-content: center;
        pointer-events: none;
    }
    .aircraft-symbol {
        position: absolute;
        transform: translateY(10.5px);
        z-index: 20;
    }

    /* Heading */
    .heading-pointer-wrap {
        height: 12px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #hdgPointer {
        position: absolute;
        z-index: 200;
    }
    #headingTape {
        height: 55px;
        width: 100%;
        background-color: #333333;
        position: relative;
        overflow: hidden;
    }
    #headingTrack {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        pointer-events: none;
    }
    #stdLabel {
        position: absolute;
        bottom: 0;
        right: 0;
        z-index: 500;
        padding-left: 0.25rem;
        padding-right: 0.25rem;
        border: 2px solid white;
        background-color: #161616;
    }

    /* Altitude Tape */
    #altimeterTape {
        width: 63px;
        border-top-right-radius: 0.375rem;
        border-bottom-right-radius: 0.375rem;
    }
    #altitudeScaleTrack {
        border-top-right-radius: 0.375rem;
        border-bottom-right-radius: 0.375rem;
    }
    .alt-svg-container {
        position: absolute;
        transform: translate(-60px, -16px);
        z-index: 20;
    }

    /* Controls UI */
    .controls-panel {
        width: 512px;
        background-color: #161616;
        border-radius: 0.5rem;
        padding: 1rem;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 1.5rem;
        row-gap: 0.75rem;
        color: white;
        font-size: 0.875rem;
        box-sizing: border-box;
    }
    .ctrl-col-full {
        grid-column: span 2 / span 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .ctrl-col-half {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
    }
    .slider-long { width: 16rem; }
    .slider-short { width: 8rem; }

    /* Dynamically created JS classes */
    .ladder-line { position: absolute; display: flex; align-items: center; justify-content: center; width: 100%; }
    .ladder-label { position: absolute; color: white; font-size: 1.5rem; }

    .heading-tick { position: absolute; top: 0; display: flex; flex-direction: column; align-items: center; }
    .heading-label { color: white; font-size: 1.5rem; }

    .overspeed-tick { position: absolute; right: 0; background-color: rgb(153, 27, 27); z-index: 2; }
    .airspeed-tick { position: absolute; right: 0; background-color: white; z-index: 10; }
    .airspeed-label { position: absolute; color: white; font-size: 31px; right: 2px; z-index: 10; text-align: right; }

    .svg-text-42 { font-size: 42px; }
    .svg-text-40 { font-size: 40px; }

    .altitude-tick { position: absolute; left: 0; background-color: white; }
    .altitude-label { position: absolute; color: white; font-size: 31px; }

    </style>
</head>
<body>
    <div class="instrument-container">
        <div class="instrument-display">

            <!-- Airspeed Tape -->
            <div id="speedTape" class="tape-container">
                <!-- Sliding Background Scale -->
                <div id="airspeedScaleTrack" class="scale-track"></div>

                <div class="speed-svg-container">

                <div id="artificialHorizon">

                    </div>
                    <div id="rollPointerContainer">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="margin-top: 37px;">
                            <path d="M12 0 L24 22 H0 Z" fill="white" />

                        <svg width="201" height="27" viewBox="0 0 201 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0.5 9.5V0.5H46.5V26.5H37V9.5H0.5Z" fill="#FAE947" stroke="black"/>
                        <rect x="96" y="0.5" width="9" height="9" fill="#FAE947" stroke="black"/>

                <!-- Sliding Background Scale -->

    <!-- Controls -->
    <div class="controls-panel">
        <div class="ctrl-col-full">
            <label for="pitchSlider">Pitch <span id="pitchLabel" class="ctrl-label" style="color:#FDE500"></span>°</label>
            <input type="range" id="pitchSlider" min="-90" max="90" step="0.5" class="slider-long">
        </div>
        <div class="ctrl-col-full">
            <label for="rollSlider">Roll <span id="rollLabel" class="ctrl-label" style="color:#FDE500"></span>°</label>
            <input type="range" id="rollSlider" min="-180" max="180" step="1" class="slider-long">
        </div>

            <label for="headingSlider">Heading <span id="headingLabel" class="ctrl-label" style="color:#FDE500"></span>°</label>

        </div>

            <label for="qnhSlider">QNH <span id="qnhLabel" class="ctrl-label" style="color:#FDE500"></span></label>

        </div>

            <label for="airspeedSlider">Airspeed <span id="airspeedLabel" class="ctrl-label" style="color:#FDE500"></span></label>

        </div>

            <label for="altitudeSlider">Altitude <span id="altitudeLabel" class="ctrl-label" style="color:#FDE500"></span> ft</label>
            <input type="range" id="altitudeSlider" min="-2000" max="45000" step="1" class="slider-long">

<script>
let pitch = 0;
let roll = 0;
let heading = 242.5;
let qnh = 1013;
let airspeed = 270;
let altitude = 14000;
let isStdSet = false;
let isOverspeed = false;

const PX_PER_DEG = 7.2;
const TAPE_SPACING = 40;

function buildPitchLadder() {
    const ladder = document.getElementById('pitchLadder');
    ladder.innerHTML = '';
    const angles = [];
    for (let a = -90; a <= 90; a += 2.5) {
        angles.push(a);
    }

    angles.forEach(angle => {
        const line = document.createElement('div');
        line.className = 'ladder-line';

        const absAngle = Math.abs(angle);
        let width, height, showLabel = false;

        if (absAngle % 10 === 0) {
            width = 128;
            height = 3;
            showLabel = true;
        } else if (absAngle % 5 === 0) {
            width = 72;
            height = 3;
        } else {
            width = 38;
            height = 2;
        }

        const offsetPx = -(angle / 2.5) * 18;
        line.style.transform = `translateY(${offsetPx}px)`;
        line.style.width = `${width}px`;
        line.style.height = `${height}px`;
        line.style.backgroundColor = 'white';
        line.style.opacity = angle === 0 ? '0' : '1';

        if (showLabel && angle !== 0) {
            const label = document.createElement('span');
            label.className = 'ladder-label';
            label.style.right = `${width / 2 + 68}px`;
            label.textContent = Math.abs(angle);
            line.appendChild(label);

            const labelLeft = document.createElement('span');
            labelLeft.className = 'ladder-label';
            labelLeft.style.left = `${width / 2 + 68}px`;
            labelLeft.textContent = Math.abs(angle);
            line.appendChild(labelLeft);
        }
        ladder.appendChild(line);
    });
}

function buildHeadingTrack() {
    const track = document.getElementById('headingTrack');
    track.innerHTML = '';
    const firstTick = Math.floor(heading / 5) * 5;
    const headingPoles = {0: "N", 18: "S", 9: "W", 27: "E"};

    for (let tickHdg = firstTick - 50; tickHdg <= firstTick + 55; tickHdg += 5) {
        const hdg = ((tickHdg % 360) + 360) % 360;
        const isMajor = hdg % 10 === 0;
        const delta = tickHdg - heading;

        const tick = document.createElement('div');
        tick.className = 'heading-tick';
        tick.style.transform = `translateX(${delta * PX_PER_DEG}px)`;

        const line = document.createElement('div');
        line.style.width = '3px';
        line.style.height = `${isMajor ? 12 : 8}px`;
        line.style.backgroundColor = 'white';
        tick.appendChild(line);

        if (isMajor) {
            const label = document.createElement('span');
            const numberHdg = parseInt(Math.round(hdg / 10).toString().padStart(2, '0'));
            label.className = 'heading-label';
            label.textContent = headingPoles[numberHdg] || numberHdg;
            tick.appendChild(label);
        }
        track.appendChild(tick);
    }
}

function buildAirspeedScale() {
    const track = document.getElementById('airspeedScaleTrack');
    track.innerHTML = '';
    const PX_PER_KNOT = 6.5;

    const v = Math.max(40, airspeed);
    const minSpd = Math.floor((v - 80) / 10) * 10;
    const maxSpd = Math.ceil((v + 80) / 10) * 10;

    for (let spd = minSpd; spd <= maxSpd; spd += 10) {
            if (spd < 40) continue;

            const deltaSpd = spd - v;
            const y = 224 - (deltaSpd * PX_PER_KNOT);

            const tick = document.createElement('div');
            const tick2 = document.createElement('div');

            if (spd > 280) {
              tick.className = 'overspeed-tick';
              tick.style.top = `${y}px`;
              tick.style.width = spd % 20 === 0 ? '0px' : '12px';
              tick.style.height = '130px';
              track.appendChild(tick);
            }
              tick2.className = 'airspeed-tick';
              tick2.style.top = `${y}px`;
              tick2.style.width = spd % 20 === 0 ? '0px' : '18px';
              tick2.style.height = '2px';
              track.appendChild(tick2);

            if (spd % 20 === 0) {
                const label = document.createElement('span');
                label.className = 'airspeed-label';
                label.style.top = `${y}px`;
                label.style.transform = 'translateY(-50%)';
                label.textContent = spd.toString();
                track.appendChild(label);
            }
        }
}

function buildAirspeedTape() {
    const v = Math.max(40, airspeed);
    const track = document.getElementById('airspeedTapeTrack');
    track.innerHTML = '';

    const centerBase = Math.floor(v);
    const minVal = centerBase - 3;
    const maxVal = centerBase + 3;

    for (let val = minVal; val <= maxVal; val++) {
        if (val < 40) continue;
        const actualY = 65 - (val - v) * TAPE_SPACING;
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", "56");
        text.setAttribute("y", actualY);
        text.setAttribute("font-family", "'B612 Mono', monospace");
        text.setAttribute("class", "svg-text-42");
        if (val >= 271) isOverspeed = true;
        else isOverspeed = false;
        text.setAttribute("fill", isOverspeed ? "red" : "white");
        text.setAttribute("text-anchor", "start");
        let digit = Math.abs(val) % 10;
        text.textContent = digit.toString();
        track.appendChild(text);
    }

    const hundredsTrack = document.getElementById('airspeedHundredsTrack');
    hundredsTrack.innerHTML = '';
    const rem = ((v % 10) + 10) % 10;
    let progress = 0;

    if (rem >= 9) {
        progress = rem - 9;
    }

    const curr_h = Math.floor(v / 10);
    const next_h = curr_h + 1;
    const baseY = 65;
    const y_curr = baseY + progress * 50;
    const y_next = baseY - 50 + progress * 50;

    const createText = (val, y) => {
        if (val < 4) return;
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", "56");
        text.setAttribute("y", y);
        if (isOverspeed && airspeed >= 271) text.setAttribute("fill", "red");
        else text.setAttribute("fill", "white");
        text.setAttribute("font-family", "'B612 Mono', monospace");
        text.setAttribute("class", "svg-text-42");
        text.setAttribute("text-anchor", "end");
        text.textContent = val.toString();
        hundredsTrack.appendChild(text);
    };

    createText(curr_h, y_curr);
    createText(next_h, y_next);
}

function buildAltitudeScale() {
    const track = document.getElementById('altitudeScaleTrack');
    track.innerHTML = '';
    const PX_PER_FT = 0.37;

    const minScaleAlt = Math.floor((altitude - 800) / 100) * 100;
    const maxScaleAlt = Math.ceil((altitude + 800) / 100) * 100;

    for (let alt = minScaleAlt; alt <= maxScaleAlt; alt += 100) {
        const is500 = alt % 500 === 0;
        const is1000 = alt % 1000 === 0;

        const deltaAlt = alt - altitude;
        const y = 238 - (deltaAlt * PX_PER_FT);

        const tick = document.createElement('div');
        tick.className = 'altitude-tick';
        tick.style.top = `${y}px`;
        tick.style.width = (is500 || is1000) ? '0px' : '18px';
        tick.style.height = '2px';
        track.appendChild(tick);

        if (is500 || is1000) {
            const label = document.createElement('span');
            label.className = 'altitude-label';
            label.style.top = `${y}px`;
            label.style.transform = 'translateY(-50%)';
            label.textContent = is1000 ? "000" : "500";
            track.appendChild(label);
        }
    }
}

function buildAltitudeTape() {
    const track = document.getElementById('altitudeTapeTrack');
    track.innerHTML = '';

    const v = altitude;
    const centerBase = Math.floor(v / 20) * 20;
    const minAlt = centerBase - 60;
    const maxAlt = centerBase + 60;

    for (let val = minAlt; val <= maxAlt; val += 20) {
        const actualY = 70 - ((val - v) / 20) * TAPE_SPACING;
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", "78");
        text.setAttribute("y", actualY - 8);
        text.setAttribute("fill", "white");
        text.setAttribute("font-family", "'B612 Mono', monospace");
        text.setAttribute("font-size", "32");
        text.setAttribute("text-anchor", "start");
        let absVal = Math.abs(val);
        let remainder = absVal % 100;
        text.textContent = remainder.toString().padStart(2, '0');
        track.appendChild(text);
    }

    const hundredsTrack = document.getElementById('altitudeHundredsTrack');
    hundredsTrack.innerHTML = '';

    const abs_v = Math.abs(v);
    const sign = v < 0 ? -1 : 1;
    const rem = abs_v % 100;
    let progress = 0;

    if (rem >= 80) {
        progress = (rem - 80) / 20;
    }

    const curr_h = Math.trunc(abs_v / 100) * sign;
    const next_h = (Math.trunc(abs_v / 100) + 1) * sign;
    const baseY = 65;

    const y_curr = baseY + progress * 50 * sign;
    const y_next = baseY + (-50 * sign) + progress * 50 * sign;

    const createText = (val, y) => {
        let str = val.toString();
        if (val === 0) {
            str = v < 0 ? "-" : "";
        }
        if (str === "") return;

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", "79");
        text.setAttribute("y", y);
        text.setAttribute("fill", "white");
        text.setAttribute("font-family", "'B612 Mono', monospace");
        text.setAttribute("class", "svg-text-40");
        text.setAttribute("text-anchor", "end");
        text.textContent = str;
        hundredsTrack.appendChild(text);
    };

    createText(curr_h, y_curr);
    createText(next_h, y_next);
}

function populateData() {
    const machElement = document.getElementById('machValue');
    const stdLabel = document.getElementById('stdLabel');
    if (isStdSet) stdLabel.textContent = `STD`;
    else stdLabel.textContent = `PUSH STD`;
    const qnhValueElement = document.getElementById('qnhValue');
    if (!isStdSet) qnhValueElement.textContent = `${qnh}HP`;
    else qnhValueElement.textContent = `STD\u00A0\u00A0`;


    let machVal = 0.5;

    machVal >= 0.50
        ? machVal >= 1 ? machElement.textContent = `M${machVal.toFixed(2)}` : machElement.textContent = `M.${machVal.toFixed(2).slice(2)}`
        : machElement.textContent = `M.`;
}

function updateAttitude() {
    const groundEarth = document.getElementById('groundEarth');
    const pitchLadder = document.getElementById('pitchLadder');
    const rollPointer = document.getElementById('rollPointerContainer');

    groundEarth.style.transform = `rotate(${roll}deg) translateY(${pitch * PX_PER_DEG}px)`;
    pitchLadder.style.transform = `rotate(${roll}deg) translateY(${pitch * PX_PER_DEG}px)`;

    rollPointer.style.transform = roll >= 60 ? `rotate(59deg)` : roll <= -60 ? `rotate(-59deg)` : `rotate(${roll}deg)`;
}

function updateControlLabels() {
    document.getElementById('pitchLabel').textContent = pitch.toFixed(1);
    document.getElementById('rollLabel').textContent = roll.toFixed(0);
    document.getElementById('headingLabel').textContent = heading.toFixed(1);
    document.getElementById('qnhLabel').textContent = qnh;
    document.getElementById('airspeedLabel').textContent = airspeed.toFixed(1);
    document.getElementById('altitudeLabel').textContent = altitude.toFixed(0);
}

function renderAll() {
    buildPitchLadder();
    buildHeadingTrack();
    buildAirspeedTape();
    buildAirspeedScale();
    buildAltitudeTape();
    buildAltitudeScale();
    populateData();
    updateAttitude();
    updateControlLabels();
}

function wireControls() {
    const pitchSlider = document.getElementById('pitchSlider');
    const rollSlider = document.getElementById('rollSlider');
    const headingSlider = document.getElementById('headingSlider');
    const qnhSlider = document.getElementById('qnhSlider');
    const airspeedSlider = document.getElementById('airspeedSlider');
    const altitudeSlider = document.getElementById('altitudeSlider');

    pitchSlider.value = pitch;
    rollSlider.value = roll;
    headingSlider.value = heading;
    qnhSlider.value = qnh;
    airspeedSlider.value = airspeed;
    altitudeSlider.value = altitude;

    pitchSlider.addEventListener('input', e => {
        pitch = parseFloat(e.target.value);
        updateAttitude();
        updateControlLabels();
    });
    rollSlider.addEventListener('input', e => {
        roll = parseFloat(e.target.value);
        updateAttitude();
        updateControlLabels();
    });
    headingSlider.addEventListener('input', e => {
        heading = parseFloat(e.target.value);
        buildHeadingTrack();
        updateControlLabels();
    });
    qnhSlider.addEventListener('input', e => {
        qnh = parseInt(e.target.value, 10);
        populateData();
        updateControlLabels();
    });
    airspeedSlider.addEventListener('input', e => {
        airspeed = parseFloat(e.target.value);
        buildAirspeedTape();
        buildAirspeedScale();
        updateControlLabels();
    });
    altitudeSlider.addEventListener('input', e => {
        altitude = parseFloat(e.target.value);
        buildAltitudeTape();
        buildAltitudeScale();
        updateControlLabels();
    });
}

wireControls();
renderAll();
</script>
</body>
</html>
